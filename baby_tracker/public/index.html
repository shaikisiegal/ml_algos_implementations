<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale stops iOS from zooming in when a text field is focused -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Installable web app ("Add to Home Screen"). Paths include the GitHub Pages
         base URL, which must match experiments.baseUrl in app.json. -->
    <link rel="manifest" href="/ml_algos_implementations/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/ml_algos_implementations/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Baby Log" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #fff8f3;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121016;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Offline support: only on the deployed site, not the local dev server.
      var BASE = '/ml_algos_implementations/';
      if ('serviceWorker' in navigator && location.pathname.indexOf(BASE) === 0 && location.hostname !== 'localhost') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE });
        });
      }
    </script>
  </body>
</html>
